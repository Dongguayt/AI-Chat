services:
  # 1. MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: aichat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: aichat_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      #自动执行SQL 文件进行初始化
      - ./Back_end/database/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # 确保带上密码，这样只有真正初始化完毕能登录了才算健康
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p123456" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: aichat-redis
    ports:
      - "6379:6379"

  # 3. 后端
  backend:
    build: ./Back_end
    container_name: aichat-backend
    restart: always
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY} # 从宿主机读取
      - MYSQL_HOST=mysql # 用容器名连接
      - MYSQL_PASSWORD=123456
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy #等 MySQL 健康了再启动
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  # 4. 前端
  frontend:
    build: ./Front_end
    container_name: aichat-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
