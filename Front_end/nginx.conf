server {
    listen 80;
    server_name localhost;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # 解决 React 刷新 404
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8000/api/; # 指向 docker-compose 里的 backend 服务
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # 针对 SSE (流式) 的特殊配置：必须关闭缓冲！
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }
}